# ============================================
# MAILFORGE - CI Pipeline
# ============================================
# Este workflow se ejecuta en cada push y pull request.
# Verifica: instalación, lint, TypeScript y build.
# ============================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # CI para la aplicación Next.js (apps/web)
  # ============================================
  web-ci:
    name: Next.js App CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ============================================
  # Validación de Docker Compose
  # ============================================
  docker-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Check for security issues
        run: |
          # Verificar que no hay secrets hardcodeados
          if grep -E "(password|secret|key).*[:=].*[a-zA-Z0-9]{20,}" docker-compose.yml | grep -v "\${" | grep -v "changeme" | grep -v "#"; then
            echo "ERROR: Posible secreto hardcodeado en docker-compose.yml"
            exit 1
          fi
          echo "✅ No se encontraron secrets hardcodeados"

  # ============================================
  # Validación de archivos de infraestructura
  # ============================================
  infra-validate:
    name: Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          files=(
            ".env.example"
            ".gitignore"
            "README.md"
            "docker-compose.yml"
            "docs/architecture.md"
            "infrastructure/postgres/init.sql"
          )
          
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file no encontrado"
              exit 1
            fi
            echo "✅ $file existe"
          done

      - name: Check infrastructure READMEs
        run: |
          for dir in postfix dovecot rspamd nginx; do
            if [ ! -f "infrastructure/$dir/README.md" ]; then
              echo "ERROR: infrastructure/$dir/README.md no encontrado"
              exit 1
            fi
            echo "✅ infrastructure/$dir/README.md existe"
          done

      - name: Verify no secrets in repository
        run: |
          # Verificar que .env no está commiteado
          if git ls-files | grep -q "^\.env$"; then
            echo "ERROR: .env está commiteado al repositorio"
            exit 1
          fi

          # Verificar que no hay claves privadas
          if git ls-files | grep -qE "\.(key|pem|p12)$"; then
            echo "ERROR: Claves privadas encontradas en el repositorio"
            exit 1
          fi

          echo "✅ No se encontraron secrets en el repositorio"

  # ============================================
  # Validación de SQL
  # ============================================
  sql-validate:
    name: SQL Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SQL syntax
        run: |
          # Verificar que el SQL tiene las tablas necesarias
          tables=("domains" "users" "mailboxes" "aliases" "sessions" "audit_logs" "mail_settings")
          
          for table in "${tables[@]}"; do
            if ! grep -q "CREATE TABLE.*$table" infrastructure/postgres/init.sql; then
              echo "ERROR: Tabla $table no encontrada en init.sql"
              exit 1
            fi
            echo "✅ Tabla $table definida"
          done

      - name: Check for password hashing comments
        run: |
          if ! grep -q "Argon2id\|argon2id" infrastructure/postgres/init.sql; then
            echo "WARNING: No se encontró referencia a Argon2id en el schema"
            echo "Asegúrate de que las contraseñas se hasheen con Argon2id en la aplicación"
          else
            echo "✅ Referencia a Argon2id encontrada"
          fi
