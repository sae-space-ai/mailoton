# ============================================
# MAILFORGE - Docker Compose (Fase 1 - Inicial)
# ============================================
# NOTA: Este archivo está preparado para la Fase 1.
# Los servicios de correo (Postfix, Dovecot) se activarán en Fases posteriores.
# Por ahora solo incluye servicios de desarrollo y documentación.
# ============================================

services:
  # ============================================
  # POSTGRESQL - Base de datos
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: mailforge_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mailforge}
      POSTGRES_USER: ${DB_USER:-mailforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mailforge_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mailforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # REDIS - Cache y rate limiting
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: mailforge_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mailforge_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # TRAEFIK - Proxy inverso (TLS automático)
  # ============================================
  traefik:
    image: traefik:v3.0
    container_name: mailforge_traefik
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Entrypoints para correo (se activarán en Fase 4-5)
      # - "--entrypoints.smtp.address=:25"
      # - "--entrypoints.submission.address=:587"
      # - "--entrypoints.smtps.address=:465"
      # - "--entrypoints.imaps.address=:993"
      # Let's Encrypt (se activará cuando haya dominio)
      # - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      # - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      # - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard de Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - mailforge_network
    restart: unless-stopped

