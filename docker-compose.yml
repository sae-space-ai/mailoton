# ============================================
# MAILFORGE - Docker Compose (Fase 1 - Inicial)
# ============================================
# NOTA: Este archivo está preparado para la Fase 1.
# Los servicios de correo (Postfix, Dovecot) se activarán en Fases posteriores.
# ============================================

services:
  # ============================================
  # POSTGRESQL - Base de datos central
  # ============================================
  # Uso: Almacenamiento de usuarios, dominios, buzones, alias y configuración
  # Se mantiene porque es la base de datos central del sistema
  postgres:
    image: postgres:16-alpine
    container_name: mailforge_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mailforge}
      POSTGRES_USER: ${DB_USER:-mailforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - mailforge_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mailforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

